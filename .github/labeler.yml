# Only label pull requests that change nothing but the sub-project, because
# .github/release.yml drops `guides` and `preview-package` pull requests from
# the release notes.
guides:
  - changed-files:
      - all-globs-to-all-files: "guides/**"

i18n:
  - changed-files:
      - all-globs-to-all-files: "i18n/**"

devise:
  - changed-files:
      - all-globs-to-all-files: "devise/**"

preview-package:
  - changed-files:
      - any-glob-to-all-files:
          - "packages/preview/**"
          - ".release-please-manifest.json"
